<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Dark Escape House - 3D Horror Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
            touch-action: none;
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* HUD Container */
        #hud {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* Stats Anzeige oben links */
        #stats {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.6;
            min-width: 150px;
        }

        .stat-bar {
            margin: 5px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .stat-label {
            min-width: 60px;
        }

        .bar-container {
            flex: 1;
            height: 12px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.3s, background-color 0.3s;
        }

        .bar-health { background: #e74c3c; }
        .bar-hunger { background: #f39c12; }
        .bar-thirst { background: #3498db; }

        /* Info Anzeige oben rechts (UNTER Inventar-Button) */
        #info {
            position: absolute;
            top: 80px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            text-align: right;
            line-height: 1.6;
        }

        /* Joystick Container links unten */
        #joystickContainer {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 120px;
            height: 120px;
            pointer-events: auto;
        }

        #joystickBase {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
        }

        #joystickStick {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s;
        }

        /* Interact Button rechts unten */
        #interactBtn {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            background: rgba(46, 204, 113, 0.7);
            border: 3px solid rgba(46, 204, 113, 1);
            border-radius: 50%;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }

        #interactBtn:active {
            background: rgba(46, 204, 113, 1);
            transform: scale(0.95);
        }

        #interactBtn.disabled {
            background: rgba(127, 140, 141, 0.5);
            border-color: rgba(127, 140, 141, 0.7);
        }

        /* Room Info Center-Top */
        #roomInfo {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #roomInfo.show {
            opacity: 1;
        }

        /* Message Display */
        #message {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(231, 76, 60, 0.9);
            color: #fff;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
            max-width: 80%;
            pointer-events: none;
        }

        #message.show {
            opacity: 1;
        }

        /* Fade Overlay für Raum-Wechsel */
        #fadeOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            opacity: 0;
            pointer-events: none;
            z-index: 500;
            transition: opacity 0.5s;
        }

        #fadeOverlay.active {
            opacity: 1;
        }

        /* Loading Screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            font-size: 18px;
        }

        #loading.hidden {
            display: none;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== INVENTAR OVERLAY ===== */
        #inventoryOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 600;
            display: none;
            flex-direction: column;
            pointer-events: auto;
        }

        #inventoryOverlay.active {
            display: flex;
        }

        #inventoryHeader {
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
        }

        #inventoryTitle {
            font-size: 20px;
            font-weight: bold;
        }

        #inventoryClose {
            font-size: 28px;
            cursor: pointer;
            background: rgba(231, 76, 60, 0.8);
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #e74c3c;
            transition: all 0.2s;
        }

        #inventoryClose:active {
            background: rgba(231, 76, 60, 1);
            transform: scale(0.95);
        }

        #inventoryGrid {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            align-content: start;
        }

        .inventory-slot {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .inventory-slot.empty {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            cursor: default;
        }

        .inventory-slot.filled:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.2);
        }

        .item-count {
            position: absolute;
            bottom: 4px;
            right: 6px;
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 2px 6px;
            border-radius: 4px;
            color: #fff;
        }

        /* Item Details Modal */
        #itemDetailsModal {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(20, 20, 20, 0.98);
            border-top: 3px solid rgba(255, 255, 255, 0.3);
            padding: 20px;
            z-index: 700;
            display: none;
            flex-direction: column;
            gap: 15px;
            color: #fff;
            max-height: 50%;
            overflow-y: auto;
        }

        #itemDetailsModal.active {
            display: flex;
        }

        #itemDetailsHeader {
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
        }

        #itemDetailsIcon {
            font-size: 40px;
        }

        #itemDetailsName {
            font-size: 20px;
            font-weight: bold;
            flex: 1;
        }

        #itemDetailsText {
            font-size: 14px;
            line-height: 1.6;
            color: #ccc;
        }

        #itemDetailsActions {
            display: flex;
            gap: 10px;
        }

        .item-action-btn {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .item-action-btn.use {
            background: #2ecc71;
            color: #fff;
        }

        .item-action-btn.use:active {
            background: #27ae60;
            transform: scale(0.98);
        }

        .item-action-btn.drop {
            background: #e74c3c;
            color: #fff;
        }

        .item-action-btn.drop:active {
            background: #c0392b;
            transform: scale(0.98);
        }

        .item-action-btn.close {
            background: #95a5a6;
            color: #fff;
        }

        /* Inventar Button im HUD */
        #inventoryBtn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 60px;
            height: 60px;
            background: rgba(52, 152, 219, 0.7);
            border: 3px solid rgba(52, 152, 219, 1);
            border-radius: 50%;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.2s;
        }

        #inventoryBtn:active {
            background: rgba(52, 152, 219, 1);
            transform: scale(0.95);
        }

        /* ===== MEDIA QUERIES FÜR KLEINE SCREENS ===== */
        @media (max-width: 480px) {
            /* Inventar-Grid: 4 Spalten auf kleinen Screens */
            #inventoryGrid {
                grid-template-columns: repeat(4, 1fr);
            }

            /* Kleinere Fonts für Stats */
            #stats {
                font-size: 12px;
                padding: 8px 12px;
                min-width: 130px;
            }

            .stat-label {
                min-width: 50px;
            }

            /* Info Box kompakter */
            #info {
                font-size: 11px;
                padding: 8px 12px;
            }

            /* Joystick kleiner */
            #joystickContainer {
                width: 100px;
                height: 100px;
                bottom: 20px;
                left: 20px;
            }

            #joystickStick {
                width: 40px;
                height: 40px;
            }

            /* Interact Button kleiner */
            #interactBtn {
                width: 60px;
                height: 60px;
                bottom: 20px;
                right: 20px;
                font-size: 28px;
            }

            /* Room Info kleiner */
            #roomInfo {
                font-size: 14px;
                padding: 10px 20px;
            }

            /* Message kleiner */
            #message {
                font-size: 12px;
                padding: 10px 20px;
                bottom: 100px;
            }
        }

        @media (max-width: 360px) {
            /* Noch kleinere Screens: 3 Spalten im Inventar */
            #inventoryGrid {
                grid-template-columns: repeat(3, 1fr);
            }

            /* Stats noch kompakter */
            #stats {
                font-size: 11px;
                padding: 6px 10px;
            }

            /* Inventar-Button kleiner */
            #inventoryBtn {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading">
        <div class="spinner"></div>
        <div>Dark Escape House lädt...</div>
    </div>

    <!-- Fade Overlay -->
    <div id="fadeOverlay"></div>

    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Inventar Overlay -->
    <div id="inventoryOverlay">
        <div id="inventoryHeader">
            <div id="inventoryTitle">🎒 Inventar (<span id="invCount">0</span>/40)</div>
            <div id="inventoryClose">✕</div>
        </div>
        <div id="inventoryGrid">
            <!-- Wird mit JavaScript gefüllt -->
        </div>
    </div>

    <!-- Item Details Modal -->
    <div id="itemDetailsModal">
        <div id="itemDetailsHeader">
            <div id="itemDetailsIcon"></div>
            <div id="itemDetailsName"></div>
        </div>
        <div id="itemDetailsText"></div>
        <div id="itemDetailsActions">
            <button class="item-action-btn use" id="itemUseBtn">Benutzen</button>
            <button class="item-action-btn drop" id="itemDropBtn">Wegwerfen</button>
            <button class="item-action-btn close" id="itemCloseBtn">Schließen</button>
        </div>
    </div>

    <!-- HUD -->
    <div id="hud">
        <!-- Inventar Button oben rechts -->
        <div id="inventoryBtn">🎒</div>

        <!-- Stats oben links -->
        <div id="stats">
            <div class="stat-bar">
                <span class="stat-label">❤️ Leben</span>
                <div class="bar-container">
                    <div class="bar-fill bar-health" id="healthBar" style="width: 100%"></div>
                </div>
            </div>
            <div class="stat-bar">
                <span class="stat-label">🍞 Hunger</span>
                <div class="bar-container">
                    <div class="bar-fill bar-hunger" id="hungerBar" style="width: 100%"></div>
                </div>
            </div>
            <div class="stat-bar">
                <span class="stat-label">💧 Durst</span>
                <div class="bar-container">
                    <div class="bar-fill bar-thirst" id="thirstBar" style="width: 100%"></div>
                </div>
            </div>
        </div>

        <!-- Info oben rechts -->
        <div id="info">
            <div>Raum: <span id="currentRoom">Schlafzimmer</span></div>
            <div>🎒 Inventar: <span id="inventoryCount">0</span>/40</div>
            <div>Zeit: <span id="gameTime">00:00</span></div>
            <div>FPS: <span id="fps">60</span></div>
        </div>

        <!-- Room Info Center -->
        <div id="roomInfo"></div>

        <!-- Message Display -->
        <div id="message"></div>

        <!-- Joystick links unten -->
        <div id="joystickContainer">
            <div id="joystickBase"></div>
            <div id="joystickStick"></div>
        </div>

        <!-- Interact Button rechts unten -->
        <div id="interactBtn">✋</div>
    </div>

    <!-- Three.js r128 CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ==========================================
        // 1. GAME STATE
        // ==========================================
        const gameState = {
            currentRoom: 'bedroom',
            difficulty: 'medium',
            health: 100,
            hunger: 100,
            thirst: 100,
            time: 0, // in Sekunden
            inventory: [],
            maxInventory: 40,
            flashlightOn: false,
            flashlightBattery: 100,
            position: { x: 0, y: 0, z: 0 },

        };

        // Item-Definitionen
        const itemDefinitions = {

            key2: { name: 'Master Key', emoji: '🗝️', color: 0xC0C0C0, type: 'tool', use: 'unlock' },

            // WEAPONS
            knife: { name: 'Messer', emoji: '🔪', color: 0xC0C0C0, type: 'weapon', use: 'weapon', damage: 20 },
            board: { name: 'Brett', emoji: '🪵', color: 0x8B4513, type: 'tool', use: 'barricade' },
            rope: { name: 'Seil', emoji: '🪢', color: 0xDAA520, type: 'tool', use: 'escape' },

            // NOTES
            note1: {
                name: 'Notiz 1',

                color: 0xFFFFE0,
                type: 'note',
                text: 'The monster lives in the basement. Stay quiet!'
            },
            note2: {
                name: 'Notiz 2',
                emoji: '📄',
                color: 0xFFFFE0,
                type: 'note',
                text: 'Mom locked the front door. Find master key im attic!'
            },
            note3: {
                name: 'Notiz 3',
                emoji: '📄',
                color: 0xFFFFE0,
                type: 'note',
                text: 'Dad is dangerous when angry. Avoid the living room!'

            // MISC
            coin: { name: 'Münze', emoji: '🪙', color: 0xFFD700, type: 'misc', use: 'money' },
            remote: { name: 'Fernbedienung', emoji: '📱', color: 0x1C1C1C, type: 'tool', use: 'distract' }
        };

        // Raum-Definitionen (wird für Raum-Wechsel gebraucht)
        const roomDefinitions = {
            bedroom: {
                name: 'Schlafzimmer',
                spawnPos: { x: 0, y: 0.5, z: 0 },
                boundaries: { x: 3.5, z: 3.5 }
            },
            hallway: {
                name: 'Flur',
                spawnPos: { x: 0, y: 0.5, z: 0 },
                boundaries: { x: 5.5, z: 1.5 }
            },
            kitchen: {
                name: 'Küche',
                spawnPos: { x: 0, y: 0.5, z: 0 },
                boundaries: { x: 2.5, z: 2 }
            },
            living: {
                name: 'Wohnzimmer',
                spawnPos: { x: 0, y: 0.5, z: 0 },
                boundaries: { x: 3, z: 2.5 }
            },
            bathroom: {
                name: 'Badezimmer',
                spawnPos: { x: 0, y: 0.5, z: 0 },
                boundaries: { x: 1.5, z: 1.5 }
            },
            stairs: {
                name: 'Treppe',
                spawnPos: { x: 0, y: 0.5, z: 2 },
                boundaries: { x: 2, z: 3.5 }
            },
            basement: {
                name: 'Keller',
                spawnPos: { x: 0, y: 0.5, z: 0 },
                boundaries: { x: 4.5, z: 4.5 }
            },
            cage: {
                name: 'Käfig',
                spawnPos: { x: 0, y: 0.5, z: 0 },
                boundaries: { x: 1.5, z: 1.5 }
            },
            attic: {
                name: 'Dachboden',
                spawnPos: { x: 0, y: 0.5, z: 0 },
                boundaries: { x: 3.5, z: 2.5 }
            }
        };

        // ==========================================
        // 2. THREE.JS SETUP
        // ==========================================
        let scene, camera, renderer;
        let player; // Player-Gruppe
        let currentRoomObjects = []; // Alle Objekte im aktuellen Raum

        // Raycaster für Interaktionen
        let raycaster = new THREE.Raycaster();
        let interactableObject = null;

        // Controls
        let joystickActive = false;
        let joystickVector = { x: 0, y: 0 };
        let cameraRotation = { x: 0, y: 0 };
        let touchStartPos = { x: 0, y: 0 };

        // FPS Counter
        let frameCount = 0;
        let lastFPSUpdate = 0;

        function initThree() {
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a0a);
            scene.fog = new THREE.Fog(0x0a0a0a, 1, 15);

            // Camera (First-Person)
            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                100
            );

            // Renderer
            const canvas = document.getElementById('gameCanvas');
            renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = false; // Performance

            // Player-Gruppe (enthält Kamera)
            player = new THREE.Group();
            player.add(camera);
            camera.position.set(0, 1.6, 0); // Augenhöhe
            scene.add(player);

            // Basis-Beleuchtung
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(5, 10, 5);
            scene.add(directionalLight);

            // Resize Handler
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            console.log('Three.js initialized (r128)');
        }

        // ==========================================
        // 3. ROOM CREATION FUNCTIONS
        // ==========================================

        // Hilfsfunktion: Erstelle Wände für Raum
        function createRoomBox(width, height, depth, color) {
            const wallMaterial = new THREE.MeshLambertMaterial({
                color: color,
                side: THREE.BackSide
            });

            // Boden (sichtbar von oben)
            const floor = new THREE.Mesh(
                new THREE.PlaneGeometry(width, depth),
                new THREE.MeshLambertMaterial({ color: 0x2c1810 })
            );
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = 0;

            // Wände (Box ohne Boden und Decke)
            const walls = new THREE.Group();

            // Nord-Wand
            const wallN = new THREE.Mesh(
                new THREE.PlaneGeometry(width, height),
                wallMaterial
            );
            wallN.position.set(0, height / 2, -depth / 2);
            walls.add(wallN);

            // Süd-Wand
            const wallS = new THREE.Mesh(
                new THREE.PlaneGeometry(width, height),
                wallMaterial
            );
            wallS.position.set(0, height / 2, depth / 2);
            wallS.rotation.y = Math.PI;
            walls.add(wallS);

            // Ost-Wand
            const wallE = new THREE.Mesh(
                new THREE.PlaneGeometry(depth, height),
                wallMaterial
            );
            wallE.position.set(width / 2, height / 2, 0);
            wallE.rotation.y = -Math.PI / 2;
            walls.add(wallE);

            // West-Wand
            const wallW = new THREE.Mesh(
                new THREE.PlaneGeometry(depth, height),
                wallMaterial
            );
            wallW.position.set(-width / 2, height / 2, 0);
            wallW.rotation.y = Math.PI / 2;
            walls.add(wallW);

            return { floor, walls };
        }

        function createFurniture(width, height, depth, color, x, y, z) {
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshLambertMaterial({ color });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);

        // Hilfsfunktion: Erstelle Item (sammelbar)
        function createItem(itemId, x, y, z) {
            const itemDef = itemDefinitions[itemId];
            if (!itemDef) {
                console.error('Unknown item:', itemId);
                return null;
            }

            // Item als kleine Box mit Glow-Effect
            const geometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
            const material = new THREE.MeshLambertMaterial({
                color: itemDef.color,
                emissive: itemDef.color,
                emissiveIntensity: 0.5
            });
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.set(x, y, z);

            // UserData für Interaction
            mesh.userData.isItem = true;
            mesh.userData.itemId = itemId;
            mesh.userData.itemName = itemDef.name;

            // Rotation Animation (im Game Loop)
            mesh.userData.rotationSpeed = 0.02;

            return mesh;
        }

        // ==========================================
        // 4. ROOM LOADING
        // ==========================================

        // Fade-to-Black Effekt
        function fadeToBlack(callback, duration = 500) {
            const overlay = document.getElementById('fadeOverlay');

            // Fade Out (zu Schwarz)
            overlay.classList.add('active');

            setTimeout(() => {
                // Callback ausführen (Raum wechseln)
                if (callback) callback();

                // Fade In (zurück zu normal)
                setTimeout(() => {
                    overlay.classList.remove('active');
                }, 100);
            }, duration);
        }

        function loadRoom(roomId, useFade = false) {
            const actualLoad = () => {
                // Entferne alte Raum-Objekte
                currentRoomObjects.forEach(obj => {
                    scene.remove(obj);
                });
                currentRoomObjects = [];

                // Erstelle neuen Raum
                let roomGroup;
                switch(roomId) {
                    case 'bedroom': roomGroup = createRoom_bedroom(); break;
                    case 'hallway': roomGroup = createRoom_hallway(); break;
                    case 'kitchen': roomGroup = createRoom_kitchen(); break;
                    case 'living': roomGroup = createRoom_living(); break;
                    case 'bathroom': roomGroup = createRoom_bathroom(); break;
                    case 'stairs': roomGroup = createRoom_stairs(); break;
                    case 'basement': roomGroup = createRoom_basement(); break;
                    case 'cage': roomGroup = createRoom_cage(); break;
                    case 'attic': roomGroup = createRoom_attic(); break;
                    default: roomGroup = createRoom_bedroom();
                }

                scene.add(roomGroup);
                currentRoomObjects.push(roomGroup);

                // Update GameState
                gameState.currentRoom = roomId;
                const roomDef = roomDefinitions[roomId];

                // Setze Spieler-Position
                player.position.set(
                    roomDef.spawnPos.x,
                    roomDef.spawnPos.y,
                    roomDef.spawnPos.z
                );

                // Update UI
                document.getElementById('currentRoom').textContent = roomDef.name;
                showRoomInfo(roomDef.name);

                console.log(`Raum geladen: ${roomDef.name}`);
            };

            if (useFade) {
                fadeToBlack(actualLoad);
            } else {
                actualLoad();
            }
        }

        // ==========================================
        // 5. PLAYER CONTROLS
        // ==========================================
        function setupControls() {
            const joystickContainer = document.getElementById('joystickContainer');
            const joystickStick = document.getElementById('joystickStick');
            const canvas = document.getElementById('gameCanvas');
            const interactBtn = document.getElementById('interactBtn');

            // Joystick Touch-Steuerung
            joystickContainer.addEventListener('touchstart', (e) => {
                e.preventDefault();
                joystickActive = true;
            });

            joystickContainer.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!joystickActive) return;

                const touch = e.touches[0];
                const rect = joystickContainer.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;

                let deltaX = touch.clientX - centerX;
                let deltaY = touch.clientY - centerY;

                // Begrenze auf Joystick-Radius
                const maxRadius = 35;
                const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
                if (distance > maxRadius) {
                    deltaX = (deltaX / distance) * maxRadius;
                    deltaY = (deltaY / distance) * maxRadius;
                }

                joystickStick.style.transform = `translate(calc(-50% + ${deltaX}px), calc(-50% + ${deltaY}px))`;

                joystickVector.x = deltaX / maxRadius;
                joystickVector.y = deltaY / maxRadius;
            });

            joystickContainer.addEventListener('touchend', (e) => {
                e.preventDefault();
                joystickActive = false;
                joystickStick.style.transform = 'translate(-50%, -50%)';
                joystickVector.x = 0;
                joystickVector.y = 0;
            });

            // Kamera-Steuerung (Wisch-Gesten auf Canvas)
            canvas.addEventListener('touchstart', (e) => {
                if (e.touches.length === 1) {
                    touchStartPos.x = e.touches[0].clientX;
                    touchStartPos.y = e.touches[0].clientY;
                }
            });

            canvas.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1) {
                    const touch = e.touches[0];
                    const deltaX = touch.clientX - touchStartPos.x;
                    const deltaY = touch.clientY - touchStartPos.y;

                    cameraRotation.x -= deltaY * 0.002;
                    cameraRotation.y -= deltaX * 0.002;

                    // Begrenze Vertical Rotation
                    cameraRotation.x = Math.max(-Math.PI / 3, Math.min(Math.PI / 3, cameraRotation.x));

                    touchStartPos.x = touch.clientX;
                    touchStartPos.y = touch.clientY;
                }
            });

            // Interact Button
            interactBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleInteraction();
            });

            console.log('Controls initialized');
        }

        // Player Movement Update (called in game loop)
        function updatePlayer(delta) {
            // Bewegung basierend auf Joystick
            if (joystickActive) {
                const speed = 3 * delta; // 3 m/s
                const forward = new THREE.Vector3(0, 0, -1);
                const right = new THREE.Vector3(1, 0, 0);

                forward.applyQuaternion(player.quaternion);
                right.applyQuaternion(player.quaternion);

                forward.y = 0;
                right.y = 0;
                forward.normalize();
                right.normalize();

                const moveX = right.multiplyScalar(joystickVector.x * speed);
                const moveZ = forward.multiplyScalar(-joystickVector.y * speed);

                player.position.add(moveX);
                player.position.add(moveZ);

                // Collision Detection mit Raum-spezifischen Grenzen
                const roomDef = roomDefinitions[gameState.currentRoom];
                if (roomDef && roomDef.boundaries) {
                    const maxX = roomDef.boundaries.x;
                    const maxZ = roomDef.boundaries.z;
                    player.position.x = Math.max(-maxX, Math.min(maxX, player.position.x));
                    player.position.z = Math.max(-maxZ, Math.min(maxZ, player.position.z));
                }
            }

            // Kamera-Rotation
            player.rotation.y = cameraRotation.y;
            camera.rotation.x = cameraRotation.x;

            // Check für interagierbare Objekte
            checkInteractables();
        }

        // ==========================================
        // 6. INTERACTIONS
        // ==========================================
        function checkInteractables() {
            // Raycaster von Kamera nach vorne
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const intersects = raycaster.intersectObjects(scene.children, true);

            let foundInteractable = false;
            for (let intersect of intersects) {
                // Check für Türen
                if (intersect.distance < 2 && intersect.object.userData.isDoor) {
                    interactableObject = intersect.object;
                    foundInteractable = true;
                    document.getElementById('interactBtn').classList.remove('disabled');
                    break;
                }
                // Check für Items
                if (intersect.distance < 2.5 && intersect.object.userData.isItem) {
                    interactableObject = intersect.object;
                    foundInteractable = true;
                    document.getElementById('interactBtn').classList.remove('disabled');
                    break;
                }
            }

            if (!foundInteractable) {
                interactableObject = null;
                document.getElementById('interactBtn').classList.add('disabled');
            }
        }

        function handleInteraction() {
            if (!interactableObject) return;

            // === ITEM PICKUP ===
            if (interactableObject.userData.isItem) {
                const itemId = interactableObject.userData.itemId;
                const itemName = interactableObject.userData.itemName;

                // Check Inventar-Limit
                if (gameState.inventory.length >= gameState.maxInventory) {
                    showMessage('Inventar ist voll! (40/40)', 2000);
                    return;
                }

                // Item zum Inventar hinzufügen
                gameState.inventory.push(itemId);

                // Item aus Scene entfernen
                interactableObject.parent.remove(interactableObject);
                interactableObject = null;

                // Feedback
                showMessage(`${itemName} aufgesammelt! (${gameState.inventory.length}/${gameState.maxInventory})`, 2000);
                console.log('Picked up:', itemId);

                return;
            }

            // === DOOR INTERACTION ===
            if (interactableObject.userData.isDoor) {
                const targetRoom = interactableObject.userData.targetRoom;
                const locked = interactableObject.userData.locked || false;
                const requiredKey = interactableObject.userData.requiredKey;

                // Check ob Tür verschlossen ist
                if (locked) {
                    // Check ob Spieler den richtigen Schlüssel hat
                    if (requiredKey && gameState.inventory.includes(requiredKey)) {
                        // Tür aufschließen!
                        interactableObject.userData.locked = false;
                        showMessage(`Tür mit ${requiredKey} aufgeschlossen!`, 2000);
                        // TODO: Key verbrauchen? (je nach Game-Design)
                        return;
                    } else {
                        const keyName = requiredKey ? ` (braucht ${requiredKey})` : '';
                        showMessage(`Diese Tür ist verschlossen!${keyName}`, 2500);
                        return;
                    }
                }

                // Win Condition Check!
                if (targetRoom === 'outside') {
                    // Spieler hat das Spiel gewonnen!
                    victory();
                    return;
                }

                // Raum wechseln mit Fade-Effekt
                loadRoom(targetRoom, true);
            }
        }

        // ==========================================
        // 7. WIN/LOSE CONDITIONS (Basic)
        // ==========================================
        function victory() {
            showMessage('🎉 DU BIST ENTKOMMEN! Glückwunsch!', 5000);
            console.log('VICTORY!');
            // TODO: Victory Screen in späterem Commit
        }

        function gameOver(reason = 'Du bist gestorben') {
            showMessage(`💀 GAME OVER - ${reason}`, 5000);
            console.log('GAME OVER:', reason);
            // TODO: Game Over Screen in späterem Commit
        }

        // ==========================================
        // 8. INVENTAR SYSTEM
        // ==========================================
        let currentSelectedItem = null;

        function openInventory() {
            document.getElementById('inventoryOverlay').classList.add('active');
            renderInventory();
        }

        function closeInventory() {
            document.getElementById('inventoryOverlay').classList.remove('active');
            closeItemDetails();
        }

        function renderInventory() {
            const grid = document.getElementById('inventoryGrid');
            grid.innerHTML = '';

            // Count items (für stackable items)
            const itemCounts = {};
            gameState.inventory.forEach(itemId => {
                itemCounts[itemId] = (itemCounts[itemId] || 0) + 1;
            });

            // Render filled slots
            const uniqueItems = Object.keys(itemCounts);
            uniqueItems.forEach(itemId => {
                const itemDef = itemDefinitions[itemId];
                if (!itemDef) return;

                const slot = document.createElement('div');
                slot.className = 'inventory-slot filled';
                slot.textContent = itemDef.emoji;

                // Count Badge (wenn mehr als 1)
                if (itemCounts[itemId] > 1) {
                    const countBadge = document.createElement('div');
                    countBadge.className = 'item-count';
                    countBadge.textContent = itemCounts[itemId];
                    slot.appendChild(countBadge);
                }

                // Click to show details
                slot.addEventListener('click', () => {
                    showItemDetails(itemId);
                });

                grid.appendChild(slot);
            });

            // Render empty slots (bis 40)
            const emptySlots = gameState.maxInventory - uniqueItems.length;
            for (let i = 0; i < emptySlots; i++) {
                const slot = document.createElement('div');
                slot.className = 'inventory-slot empty';
                grid.appendChild(slot);
            }

            // Update count
            document.getElementById('invCount').textContent = gameState.inventory.length;
        }

        function showItemDetails(itemId) {
            const itemDef = itemDefinitions[itemId];
            if (!itemDef) return;

            currentSelectedItem = itemId;

            const modal = document.getElementById('itemDetailsModal');
            document.getElementById('itemDetailsIcon').textContent = itemDef.emoji;
            document.getElementById('itemDetailsName').textContent = itemDef.name;

            // Text für Notes oder generische Info
            let detailsText = '';
            if (itemDef.type === 'note' && itemDef.text) {
                detailsText = itemDef.text;
            } else if (itemDef.type === 'consumable') {
                if (itemDef.restores_hunger) detailsText += `Hunger +${itemDef.restores_hunger}  `;
                if (itemDef.restores_thirst) detailsText += `Durst +${itemDef.restores_thirst}  `;
                if (itemDef.restores_health) detailsText += `Leben +${itemDef.restores_health}  `;
                if (itemDef.restores) detailsText += `Batterie +${itemDef.restores}%  `;
            } else if (itemDef.type === 'tool') {
                detailsText = `Werkzeug - ${itemDef.use}`;
            } else if (itemDef.type === 'weapon') {
                detailsText = `Waffe - Schaden: ${itemDef.damage}`;
            }

            document.getElementById('itemDetailsText').textContent = detailsText || 'Ein nützlicher Gegenstand.';

            modal.classList.add('active');
        }

        function closeItemDetails() {
            document.getElementById('itemDetailsModal').classList.remove('active');
            currentSelectedItem = null;
        }

        function useItem() {
            if (!currentSelectedItem) return;

            const itemDef = itemDefinitions[currentSelectedItem];
            if (!itemDef) return;

            let used = false;
            let message = '';

            // === CONSUMABLES ===
            if (itemDef.type === 'consumable') {
                if (itemDef.use === 'eat' && itemDef.restores_hunger) {
                    gameState.hunger = Math.min(100, gameState.hunger + itemDef.restores_hunger);
                    message = `${itemDef.name} gegessen! Hunger +${itemDef.restores_hunger}`;
                    used = true;
                }
                else if (itemDef.use === 'drink' && itemDef.restores_thirst) {
                    gameState.thirst = Math.min(100, gameState.thirst + itemDef.restores_thirst);
                    message = `${itemDef.name} getrunken! Durst +${itemDef.restores_thirst}`;
                    used = true;
                }
                else if (itemDef.use === 'heal' && itemDef.restores_health) {
                    gameState.health = Math.min(100, gameState.health + itemDef.restores_health);
                    message = `${itemDef.name} benutzt! Leben +${itemDef.restores_health}`;
                    used = true;
                }
                else if (itemDef.use === 'power' && itemDef.restores) {
                    gameState.flashlightBattery = Math.min(100, gameState.flashlightBattery + itemDef.restores);
                    message = `Batterie gewechselt! +${itemDef.restores}%`;
                    used = true;
                }
            }
            // === NOTES ===
            else if (itemDef.type === 'note') {
                message = `Notiz gelesen: "${itemDef.text}"`;
                // Notes werden NICHT verbraucht
            }
            // === TOOLS/WEAPONS ===
            else {
                message = `${itemDef.name} kann hier nicht benutzt werden.`;
            }

            // Item verbrauchen (wenn consumable)
            if (used) {
                const index = gameState.inventory.indexOf(currentSelectedItem);
                if (index > -1) {
                    gameState.inventory.splice(index, 1);
                }
                closeItemDetails();
                renderInventory();
            }

            showMessage(message, 2500);
            console.log('Used item:', currentSelectedItem, message);
        }

        function dropItem() {
            if (!currentSelectedItem) return;

            const itemDef = itemDefinitions[currentSelectedItem];
            const itemName = itemDef ? itemDef.name : currentSelectedItem;

            // Item aus Inventar entfernen
            const index = gameState.inventory.indexOf(currentSelectedItem);
            if (index > -1) {
                gameState.inventory.splice(index, 1);
            }

            closeItemDetails();
            renderInventory();
            showMessage(`${itemName} weggeworfen!`, 2000);
            console.log('Dropped item:', currentSelectedItem);
        }

        // Setup Inventar Event Listeners
        function setupInventoryListeners() {
            document.getElementById('inventoryBtn').addEventListener('click', () => {
                openInventory();
            });

            document.getElementById('inventoryClose').addEventListener('click', () => {
                closeInventory();
            });

            document.getElementById('itemUseBtn').addEventListener('click', () => {
                useItem();
            });

            document.getElementById('itemDropBtn').addEventListener('click', () => {
                dropItem();
            });

            document.getElementById('itemCloseBtn').addEventListener('click', () => {
                closeItemDetails();
            });

            console.log('Inventar listeners setup');
        }

        // ==========================================
        // 9. UI UPDATES
        // ==========================================
        function updateUI() {
            // Stats Bars
            document.getElementById('healthBar').style.width = gameState.health + '%';
            document.getElementById('hungerBar').style.width = gameState.hunger + '%';
            document.getElementById('thirstBar').style.width = gameState.thirst + '%';

            // Inventar Count
            document.getElementById('inventoryCount').textContent = gameState.inventory.length;

            // Zeit
            const minutes = Math.floor(gameState.time / 60);
            const seconds = Math.floor(gameState.time % 60);
            document.getElementById('gameTime').textContent =
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // Animiere Items (Rotation)
        function animateItems() {
            currentRoomObjects.forEach(roomGroup => {
                roomGroup.children.forEach(obj => {
                    if (obj.userData.isItem && obj.userData.rotationSpeed) {
                        obj.rotation.y += obj.userData.rotationSpeed;
                    }
                });
            });
        }

        function showRoomInfo(roomName) {
            const roomInfo = document.getElementById('roomInfo');
            roomInfo.textContent = roomName;
            roomInfo.classList.add('show');
            setTimeout(() => {
                roomInfo.classList.remove('show');
            }, 2000);
        }

        function showMessage(text, duration = 3000) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = text;
            messageEl.classList.add('show');
            setTimeout(() => {
                messageEl.classList.remove('show');
            }, duration);
        }

        // ==========================================
        // 9. SURVIVAL MECHANICS (Basic)
        // ==========================================
        function updateStats(delta) {
            // Hunger & Durst sinken (basic rate für jetzt)
            gameState.hunger -= 0.1 * delta;
            gameState.thirst -= 0.15 * delta;

            // Clamp
            gameState.hunger = Math.max(0, gameState.hunger);
            gameState.thirst = Math.max(0, gameState.thirst);

            // Damage from Starvation
            if (gameState.hunger <= 0) {
                gameState.health -= 0.5 * delta;
            }
            if (gameState.thirst <= 0) {
                gameState.health -= 0.7 * delta;
            }

            gameState.health = Math.max(0, Math.min(100, gameState.health));

            // Game Over Check
            if (gameState.health <= 0) {
                console.log('GAME OVER - Gestorben!');
                // TODO: Game Over Screen
            }

            // Zeit erhöhen
            gameState.time += delta;
        }

        // ==========================================
        // 10. MAIN GAME LOOP
        // ==========================================
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            const delta = (now - lastTime) / 1000; // Sekunden
            lastTime = now;

            // Updates
            updatePlayer(delta);
            updateStats(delta);
            updateUI();
            animateItems(); // Rotiere Items

            // FPS Counter
            frameCount++;
            if (now - lastFPSUpdate > 1000) {
                document.getElementById('fps').textContent = frameCount;
                frameCount = 0;
                lastFPSUpdate = now;
            }

            // Render
            renderer.render(scene, camera);
        }

        // ==========================================
        // 11. INITIALIZATION
        // ==========================================
        function init() {
            console.log('Initializing Dark Escape House...');

            initThree();
            setupControls();
            setupInventoryListeners();
            loadRoom('bedroom'); // Start im Schlafzimmer

            // Hide Loading Screen
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
                animate();
                console.log('Game started!');
            }, 1000);
        }

        // Start Game
        window.addEventListener('load', init);
    </script>
</body>
